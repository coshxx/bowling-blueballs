# Dev mit Live-Reload:  docker compose up -d        → http://<rechner>:8000
#   Frontend (Vite-HMR) und Backend (nest --watch) laufen direkt aus ./app.
#   Parser-Änderungen brauchen weiterhin: docker compose up -d --build parser
# Prod:                 docker compose -f compose.prod.yaml up -d --build
# CLI:                  IMAGE=./bild.jpg docker compose run --rm parser-cli   → ./out.json

include:
  - compose.base.yaml

x-node: &node
  build:
    context: ./app
    dockerfile: Dockerfile.dev
  volumes:
    - ./app:/app
    - node_modules:/app/node_modules
    - api_node_modules:/app/api/node_modules
    - web_node_modules:/app/web/node_modules
    - ./data:/data

services:
  # Installiert Abhängigkeiten, bevor api und web starten
  deps:
    <<: *node
    command: npm install --no-audit --no-fund

  api:
    <<: *node
    # sh als PID 1 reicht SIGTERM nicht weiter → tini übernimmt das
    init: true
    command: sh -c "npm run -w api prisma:deploy && npm run -w api start:dev"
    environment:
      DATABASE_URL: file:/data/bowling.db
      DATA_DIR: /data
      PARSER_URL: http://parser:8080
      PORT: "3000"
      SESSION_SECRET: dev-secret
      ADMIN_USERS: ${ADMIN_USERS:-cosh}
    depends_on:
      deps:
        condition: service_completed_successfully
      parser:
        condition: service_healthy

  web:
    <<: *node
    command: npm run -w web dev
    environment:
      API_TARGET: http://api:3000
    ports:
      - "0.0.0.0:8000:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  node_modules:
  api_node_modules:
  web_node_modules:
